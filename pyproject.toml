[project]
name = "c3i-iot-testbed"
version = "2.0.0"
description = "Unified, industry-grade IoT security testbed (Bluetooth / Wi-Fi / Hardware-firmware) for the C3i Hub, IIT Kanpur."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "C3i Hub, IIT Kanpur" }]
dependencies = [
    # --- web / api ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "websockets>=13.1",
    "jinja2>=3.1",
    # --- config / validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    # --- persistence ---
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    # --- security / auth ---
    "pyjwt>=2.9",
    # --- http client (CVE / EPSS / OSV) ---
    "httpx>=0.27",
    # --- reporting ---
    "reportlab>=4.2",
    # --- misc ---
    "rich>=13.9",
]

[project.optional-dependencies]
# Hardware testbed - install only on the Raspberry Pi 5
hardware = [
    "pyserial>=3.5",
    "rpi-lgpio>=0.6; platform_machine=='aarch64'",
    "spidev>=3.6; platform_machine=='aarch64'",
]
# Optional AI assistant
assistant = [
    "chromadb>=0.5",
    "ollama>=0.3",
]
# Development / QA
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.scripts]
c3i-iot = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
